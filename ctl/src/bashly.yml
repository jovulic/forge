name: ctl
version: 0.1.0
commands:
  - name: bashly
    help: Regenerate bashly.
    dependencies: [bashly]
  - name: apply
    help: Apply configuration.
    args:
      - name: name
        help: Apply a specific configuration.
        allowed: [system, home]
      - name: host
        help: Apply a specific host.
        allowed: [licious, expert]
    flags:
      - long: --dry
        help: Print actions without performing them.
      - long: --yes
        help: Accept actions automatically.
      - long: --keep-going
        help: Keep going despite encountering errors.
      - long: --repair
        help: Repair corrupted store paths.
      - long: --show-trace
        help: Display tracebacks on errors.
      - long: --debug
        help: Show debug information, including activation logs and verbose outputs.
    dependencies: [figlet, nh]
  - name: update
    help: Update flake dependencies.
    args:
      - name: name
        help: Update a specific input.
    dependencies: [figlet, nix]
  - name: clean
    help: Perform garbage collection.
    flags:
      - long: --dry
        help: Print actions without performing them.
      - long: --yes
        help: Accept actions automatically.
      - long: --no-gc
        help: Don't run nix store --gc.
      - long: --no-gcroots
        help: Don't clean gcroots.
      - long: --optimise
        help: Run nix-store --optimise after gc.
    dependencies: [figlet, nh]
  - name: test
    help: Test system modules or custom package builds using the test-overlay.
    args:
      - name: package
        help: Build and test a specific package from our custom pkgs folder (e.g., jackify, mcp-hub, plover, exhaustive).
    flags:
      - long: --eval
        help: Dry-run evaluate the test-overlay system configuration (compilation test) without building packages.
    dependencies: [figlet, nix]
  - name: lookup
    help: Lookup the Nix source code position of a specific attribute (e.g., appimageTools.wrapType2, lib.makeBinPath).
    args:
      - name: attribute
        help: The dot-separated attribute path to lookup (e.g., appimageTools.wrapType2).
        required: true
    dependencies: [nix]
