config-version = 2

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# Workspace Navigation.
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 10'

# Focuses nearest window in direction. If at screen edge, switches focus to
# adjacent monitor.
cmd-h = 'focus left --boundaries-action fail || focus-monitor left'
cmd-j = 'focus down --boundaries-action fail || focus-monitor down'
cmd-k = 'focus up --boundaries-action fail || focus-monitor up'
cmd-l = 'focus right --boundaries-action fail || focus-monitor right'

# Moves window in direction. If at screen edge, throws window to
# adjacent monitor.
cmd-shift-h = 'move left --boundaries-action fail || move-node-to-monitor --focus-follows-window left'
cmd-shift-j = 'move down --boundaries-action fail || move-node-to-monitor --focus-follows-window down'
cmd-shift-k = 'move up --boundaries-action fail || move-node-to-monitor --focus-follows-window up'
cmd-shift-l = 'move right --boundaries-action fail || move-node-to-monitor --focus-follows-window right'

# Window layouts and splitting.
cmd-b = 'join-with left'
cmd-v = 'join-with up'
cmd-s = 'layout v_accordion'
cmd-w = 'layout h_accordion'
cmd-e = 'layout tiles horizontal vertical'
cmd-f = 'fullscreen'
cmd-shift-space = 'layout floating tiling'

# Sway-like scratchpad emulation.
cmd-minus = 'workspace --auto-back-and-forth SP'
cmd-shift-minus = 'move-node-to-workspace SP'

# Window management.
cmd-shift-q = 'close'

# Disable native quitting shortcuts globally to prevent accidental application
# quits.
cmd-q = []

# Quick Terminal Launch.
cmd-enter = 'exec-and-forget open -n -a Ghostty'

# Sway-like resize mode trigger.
cmd-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -10'
j = 'resize height +10'
k = 'resize height -10'
l = 'resize width +10'
left = 'resize width -10'
down = 'resize height +10'
up = 'resize height -10'
right = 'resize width +10'
enter = 'mode main'
esc = 'mode main'

# Static Workspace Partitioning for Triple-Monitor Setups
# Map workspaces to specific displays to maintain spatial memory:
# - Workspaces 1, 2, 3: MacBook
# - Workspaces 4 to 7: Big Screen
# - Workspaces 8 to 10 (0): Smaller Screen
[workspace-to-monitor-force-assignment]
"1" = 'built-in'
"2" = 'built-in'
"3" = 'built-in'

"4" = [2, 'main', 'built-in']
"5" = [2, 'main', 'built-in']
"6" = [2, 'main', 'built-in']
"7" = [2, 'main', 'built-in']

"8" = [3, 'secondary', 'built-in']
"9" = [3, 'secondary', 'built-in']
"10" = [3, 'secondary', 'built-in']
